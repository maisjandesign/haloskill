<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Concept — copy to Figma</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#09090b;color:#f4f4f5;font:14px system-ui,sans-serif}.toolbar{padding:20px 24px;display:flex;align-items:center;gap:20px;flex-wrap:wrap}button{padding:12px 20px;border:0;border-radius:8px;background:#3b82f6;color:white;font:inherit;cursor:pointer}button:disabled{opacity:.55;cursor:default}button:focus-visible,summary:focus-visible{outline:2px solid white;outline-offset:3px}.toolbar p{max-width:760px;margin:0;line-height:1.5}#status{padding:0 24px 16px;margin:0;color:#d4d4d8}details{padding:0 24px 18px}pre{white-space:pre-wrap;font-size:12px}#design{width:var(--board-width);height:var(--board-height)}
</style>
</head>
<body>
<header class="toolbar"><button id="copy" disabled>Copy to Figma</button><p>Copy here, open a Figma Design file, then paste onto the canvas with Cmd+V / Ctrl+V. No Figma plugin is needed. Inspect Auto Layout after pasting.</p></header>
<p id="status" role="status" aria-live="polite">Preparing the design…</p>
<details><summary>Capture diagnostics</summary><pre id="diagnostics"></pre></details>
<main id="design" data-board-width="1440" data-board-height="1080"></main>
<script type="module" src="./figma-copy.js"></script>
</body></html>
